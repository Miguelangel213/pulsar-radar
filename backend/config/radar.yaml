# Radar de Memecoins — configuración central (fuente: DexScreener, sin API key).
# TODOS los umbrales y pesos viven aquí, nunca en el código.
# Los valores son PROVISIONALES: se calibran mirando datos reales y /aciertos (etapa de validación).

dexscreener:
  base_url: "https://api.dexscreener.com"
  chain: solana
  timeout_s: 10
  # Límites documentados por DexScreener: 300 req/min (search, tokens, pairs) y 60 req/min (boosts, profiles).
  # Se usa un margen de seguridad por debajo.
  rate_limits:                      # llamadas por ventana de 60 s
    search: 240
    tokens: 240
    pairs: 240
    boosts: 50
    profiles: 50
  cache_ttl_s:                      # DexScreener cachea ~60 s los listados de boosts/perfiles
    search: 20
    tokens: 10
    pairs: 15
    boosts: 60
    profiles: 60
  backoff: { max_retries: 3, base_delay_s: 0.5, factor: 2.0, max_delay_s: 6.0 }

links:                              # se generan solas con la dirección del contrato / del par
  dexscreener: "https://dexscreener.com/solana/{pair_address}"
  dexscreener_chart: "https://dexscreener.com/solana/{pair_address}?embed=1&theme=dark&info=0&trades=0"
  solscan: "https://solscan.io/token/{address}"
  birdeye: "https://birdeye.so/token/{address}?chain=solana"
  gmgn: "https://gmgn.ai/sol/token/{address}"   # ficha de la moneda (el formato ?chain=&token= abre la portada de trenches)

scanner:
  db_path: "data/radar.db"          # SQLite local (tokens + histórico)
  background: true                  # hilo de fondo: escanea y guarda el histórico aunque no haya navegador abierto
  scan_interval_s: 15               # cada cuánto escanea el hilo de fondo; las peticiones del front reutilizan el último resultado
  batch_size: 30                    # direcciones por llamada a /tokens/v1 (máximo de DexScreener)
  search_queries: []                # búsquedas extra para descubrir tokens, p. ej. ["pump"]. Vacío = solo boosts y perfiles
  max_tracked: 150                  # tokens seguidos a la vez
  track_hours: 26                   # cuánto se sigue un token tras verlo por última vez (cubre el chequeo a 24 h)
  history_interval_s: 60            # mínimo entre dos filas de historial por token
  history_max_rows: 40000
  data_dir: "data"

# Etapas = reglas sobre campos de DexScreener (no existe un feed oficial de "tokens nuevos").
stages:
  new_creation:    { label: "Recién creados",   max_age_min: 120 }
  near_graduation: { label: "Por graduarse",    bonding_dex_ids: [pumpfun], min_market_cap_usd: 40000 }   # observado: los pares nacen en pumpswap con ~$56K de market cap
  graduated:       { label: "Recién graduados", dex_ids: [pumpswap, raydium], max_age_min: 1440 }
  trending:        { label: "Tendencias" }          # tokens con boost activo o en las listas de boosts

# Hard gates: solo con datos que DexScreener sí entrega. severity: reject = descarte, red_flag = marca roja.
gates:
  min_liquidity:  { severity: reject,   min_usd: 1500 }
  min_activity:   { severity: red_flag, min_txns_h1: 5, applies_after_min: 30 }
  dump_h1:        { severity: red_flag, min_change_pct: -60 }
  sell_wall:      { severity: red_flag, max_sell_to_buy: 2.0, min_txns_h1: 20 }

# ---------------------------------------------------------------------------
# GMGN (opcional, el visitante pone su propia API key en el navegador; sin key se usa DexScreener).
# Umbrales calibrados con una muestra real: percentiles de rug_ratio, bundlers, top10, dev, smart money.
# ---------------------------------------------------------------------------
gmgn:
  base_url: "https://openapi.gmgn.ai"
  chain: sol
  rank_interval: "1h"
  scan_interval_s: 45               # GMGN free tiene límites bajos: consulta con calma
  cache_ttl_s: 30
  min_pause_s: 30                   # si GMGN pide esperar (429/ban), pausa al menos esto...
  pause_margin_s: 20                # ...más este margen de seguridad (relojes distintos: reintentar 1 s antes cuenta como infracción)
  backoff_base_s: 120               # si vuelve a responder 429 tras la pausa, la espera crece: 120, 240, 480... s
  max_pause_s: 3600                 # tope de cualquier espera (por si GMGN mandara un valor absurdo)
  trenches_body: { filters: [offchain, onchain], launchpad_platform_v2: true, limit: 80, quote_address_type: [4, 5, 3, 1, 13, 0] }

# Hard gates con datos de GMGN (solo se evalúan si el token trae datos de GMGN).
gmgn_gates:
  honeypot:        { severity: reject }
  tax:             { severity: reject,   max: 0.10 }         # fracción: 0.10 = 10 %
  mint_authority:  { severity: red_flag }
  freeze_authority: { severity: red_flag }
  wash_trading:    { severity: reject }
  rug_ratio:       { severity: red_flag, max: 0.30, reject_above: 0.80 }
  bundlers:        { severity: red_flag, max_rate: 0.35 }
  top10:           { severity: red_flag, max_rate: 0.40 }
  snipers:         { severity: red_flag, max_count: 10 }
  insiders:        { severity: red_flag, max_rate: 0.10 }
  dev_holding:     { severity: red_flag, max_rate: 0.15 }
  serial_deployer: { severity: red_flag, min_created: 10, max_open_ratio: 0.10 }   # muchos lanzamientos y casi ninguno prospera

# ---------------------------------------------------------------------------
# Scoring inicial. Reglas explícitas, sin ML. "ramp" mapea lineal [lo, hi] -> [0, 100].
# ---------------------------------------------------------------------------
scoring:
  unknown_neutral: 50
  min_txns_h1: 10                  # muestra mínima para confiar en el ratio compras/ventas de 1 h
  min_txns_m5: 6
  risk:                            # 0 = sin riesgo de mercado, 100 = máximo
    weights: { liquidity: 0.30, age: 0.15, sell_pressure: 0.25, drop: 0.15, contract: 0.15 }
    levels: { solid_max: 20, moderate_max: 35, high_max: 50 }   # escala comprimida: 'contract' fijo en 50 aporta 7.5 puntos
    liquidity: { liq_ramp: [3000, 40000], liq_to_mcap_ramp: [0.03, 0.25] }
    age: { age_ramp_min: [0, 180] }                  # más joven = más riesgo
    sell_pressure: { sell_ratio_ramp: [0.50, 0.70] }
    drop: { drop_ramp_pct: [5, 50] }                 # caída de precio en 1 h
    contract_unavailable: 50                         # DexScreener no entrega seguridad del contrato
  potential:                       # 0 = sin señales, 100 = señales máximas
    weights: { liquidity: 0.20, volume: 0.25, market_cap: 0.15, age: 0.10, buy_sell: 0.30 }
    liquidity: { liq_ramp: [3000, 60000] }
    volume: { turnover_ramp: [0.02, 0.6], volume_h1_ramp: [300, 30000] }   # volumen 1h / market cap, y volumen 1h absoluto
    market_cap: { log10_ramp: [4.0, 6.5] }           # más espacio de crecimiento con market cap bajo ($10K -> $3M)
    age: { age_ramp_min: [10, 1440] }                # más reciente = más espacio
    buy_sell: { buy_ratio_ramp: [0.45, 0.65], h1_weight: 0.6, m5_weight: 0.4 }
  gmgn:                            # pesos y rampas cuando el token trae datos de GMGN
    risk_weights: { liquidity: 0.15, age: 0.10, sell_pressure: 0.15, drop: 0.10, contract: 0.20, holders: 0.20, dev: 0.10 }
    contract: { rug_ramp: [0.10, 0.80], tax_ramp: [0, 0.20], mint_points: 25, freeze_points: 20, wash_points: 40 }
    holders: { bundler_ramp: [0.05, 0.50], top10_ramp: [0.10, 0.60], sniper_ramp: [0, 15], insider_ramp: [0, 0.20], bot_ramp: [0.10, 0.70] }
    dev: { hold_ramp: [0.02, 0.30], serial_points: 40 }
    potential_weights: { liquidity: 0.15, volume: 0.20, market_cap: 0.10, age: 0.10, buy_sell: 0.20, smart_money: 0.25 }
    smart_money: { smart_ramp: [0, 10], renowned_ramp: [0, 3], smart_weight: 0.7, renowned_weight: 0.3 }
  ranking:
    risk_penalty: 0.8              # ajustado = potencial * (1 - riesgo/100 * penalty)
    quadrant: { min_potential: 65, max_risk: 25 }
    quadrant_gmgn: { min_potential: 60, max_risk: 30 }   # con datos de GMGN la escala de riesgo es otra (suma holders y dev); calibrado con una muestra real    # "alto potencial, bajo riesgo"
  disclaimer: "El potencial es una probabilidad basada en señales de mercado de DexScreener. No es una predicción de precio ni una recomendación de compra. DexScreener no entrega seguridad del contrato, holders, dev ni smart money."

# ---------------------------------------------------------------------------
# Alertas. Se evalúan en cada consulta a /alerts. Cada token se alerta una sola vez.
# ---------------------------------------------------------------------------
alerts:
  stages: [new_creation, near_graduation, graduated]
  quadrant_entry: true
  smart_money:                     # solo con datos de GMGN
    enabled: true
    max_age_min: 10                # X: minutos de vida máximos
    min_buyers: 1                  # wallets smart money mínimas
  max_stored: 200
  sound:                           # frecuencias (Hz) de las dos notas y volumen 0-1
    quadrant: [660, 990]
    smart_money: [880, 1320]
    volume: 0.12
