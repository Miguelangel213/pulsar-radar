# Radar de Memecoins — configuración central.
# TODOS los umbrales y pesos viven aquí, nunca en el código.
# AVISO: los valores son PROVISIONALES (no vienen del demo oficial de GMGN, que no está
# disponible). Se calibrarán en la etapa 8 con datos reales.

mode:
  env_file: "~/.config/gmgn/.env"   # si existe GMGN_API_KEY -> datos reales (etapa 8); si no -> MOCK

stages:                              # definición de las etapas de ingesta
  new_creation:   { label: "Recién creados",   max_age_min: 30 }
  near_graduation: { label: "Por graduarse",   min_curve_progress: 0.80 }
  graduated:      { label: "Recién graduados", max_age_since_graduation_min: 120 }
  trending:       { label: "Tendencias" }

cache:
  ttl_seconds: { new_creation: 5, near_graduation: 8, graduated: 15, trending: 20 }
  backoff: { max_retries: 4, base_delay_s: 0.5, factor: 2.0, max_delay_s: 8.0 }

mock:
  seed: 1013
  spawn_every_s: 90
  window_min: 180

# Hard gates. severity: "reject" = descarte, "red_flag" = marca roja (se muestra, no descarta).
gates:
  honeypot:        { severity: reject }
  buy_tax:         { severity: reject,   max_pct: 10 }
  sell_tax:        { severity: reject,   max_pct: 10 }
  mint_authority:  { severity: red_flag }    # mint sin renunciar
  freeze_authority: { severity: red_flag }   # freeze sin renunciar
  rug_ratio:       { severity: reject,   max: 0.30 }
  bundlers:        { severity: red_flag, max_rate: 0.25 }
  snipers:         { severity: red_flag, max_rate: 0.20 }
  top10_concentration: { severity: red_flag, max_rate: 0.40 }
  dev_holding:     { severity: red_flag, max_rate: 0.15 }
  dev_rug_history: { severity: reject,   max_rugs: 1 }

links:
  # PROVISIONAL: formato de URL pública de GMGN, sin confirmar con documentación oficial.
  gmgn_token_url: "https://gmgn.ai/sol/token/{address}"

# ---------------------------------------------------------------------------
# Scoring (etapa 3). Reglas explícitas, sin ML. Valores PROVISIONALES.
# Un "ramp" mapea lineal [lo, hi] -> [0, 100] con tope en los extremos.
# ---------------------------------------------------------------------------
scoring:
  unknown_neutral: 50          # subpuntaje cuando no hay ningún dato
  risk:                        # 0 = sin riesgo, 100 = riesgo máximo
    weights: { contract: 0.30, liquidity: 0.20, holders: 0.25, dev: 0.15, age: 0.10 }
    levels: { solid_max: 25, moderate_max: 50, high_max: 75 }   # >75 = Extremo
    contract: { tax_ramp: [0, 20], rug_ramp: [0, 0.5], mint_points: 20, freeze_points: 15 }
    liquidity: { liq_ramp: [2000, 20000], liq_to_mcap_ramp: [0.05, 0.30] }
    holders: { top10_ramp: [0.15, 0.60], bundler_ramp: [0.05, 0.40], sniper_ramp: [0.05, 0.35], holders_count_ramp: [50, 500] }
    dev: { hold_ramp: [0.02, 0.30], rugs_ramp: [0, 3], sold_points: 20 }
    age: { age_ramp_min: [0, 60] }       # más joven = más riesgo
  potential:                   # 0 = sin señales, 100 = señales máximas
    weights: { velocity: 0.25, buyers: 0.25, pressure: 0.20, dev: 0.15, narrative: 0.15 }
    velocity: { pace_ramp: [0.01, 0.08], buyers_per_min_ramp: [1, 15] }
    buyers: { smart_money_ramp: [0, 5], kol_ramp: [0, 3], early_entry_max_min: 5, early_bonus: 10 }
    pressure: { buy_ratio_ramp: [0.5, 0.8], volume_to_mcap_ramp: [0.3, 3.0] }
    dev: { clean_base: 60, per_launch_points: 3, max_launch_points: 20, sold_penalty: 40 }
    narrative: { trending_share_ramp: [0.10, 0.35] }
  ranking:
    risk_penalty: 0.8          # ajustado = potencial * (1 - riesgo/100 * penalty)
    quadrant: { min_potential: 60, max_risk: 35 }   # "alto potencial, bajo riesgo"
  disclaimer: "El potencial es una probabilidad basada en señales observables. No es una predicción de precio ni una recomendación de compra."

# ---------------------------------------------------------------------------
# Alertas (etapa 6). Se evalúan en cada consulta a /alerts. Cada (tipo, token) se dispara una sola vez.
# ---------------------------------------------------------------------------
alerts:
  stages: [new_creation, near_graduation, graduated]   # etapas que se vigilan
  quadrant_entry: true                 # token entra a "alto potencial, bajo riesgo"
  smart_money:
    enabled: true
    max_age_min: 10                    # X: minutos de vida máximos para la alerta de smart money
    min_buyers: 1                      # wallets smart money mínimas
  max_stored: 200
  sound:                               # frecuencias (Hz) de las dos notas de cada alerta, y volumen 0-1
    quadrant: [660, 990]
    smart_money: [880, 1320]
    volume: 0.12
